<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Portfólio Kontakt</title>
</head>
<body>

<!--------------------------------------------------------------------->
    
    <header>
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-navigation" aria-label="Otvoriť menu">☰</button>
        <nav id="site-navigation" class="site-nav" aria-label="Hlavná navigácia">
            <a href="index.html" class="header-domov">Domov</a>
            <a href="kontakt.html" class="header-kontakt">Kontakt</a>
            <a href="o-mne.html" class="header-omne">O mne</a>
            <a href="portfolio.html" class="header-portfolio">Portfólio</a>
        </nav>
    </header>

<!--------------------------------------------------------------------->

    <h2 class="kontakt-nadpis">Chcete ma kontaktovať?</h2>

    <section class="kontakt-form">
        <form>
            <label class="labels-kontakt">Meno:</label>
            <input type="text">

            <label class="labels-kontakt">Email:</label>
            <input type="email">

            <label class="labels-kontakt">Správa:</label>
            <textarea></textarea>

            <button type="submit">Odoslať</button>
        </form>
    </section>
<!--------------------------------------------------------------------->

    <h3 id="kontakt-border">Kontakt na mňa</h3>

    <section class="mail-telefon">
        <p class="kontakt-nazvy">Email:</p><p>aleexx.s@proton.me</p>
        <p class="kontakt-nazvy">Telefón:</p><p>+421 xxx xxx xxx</p>
        <img id="ikonky" src="icons/Group 53.png" alt="kontakty" width="90px" height="auto">
    </section>

<!--------------------------------------------------------------------->

    <footer class="kontakt-footer">© 2026 Alexandra Staňová. Všetky práva vyhradené.</footer>

    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const siteNav = document.querySelector('.site-nav');

        navToggle?.addEventListener('click', () => {
            const expanded = navToggle.getAttribute('aria-expanded') === 'true';
            navToggle.setAttribute('aria-expanded', String(!expanded));
            siteNav?.classList.toggle('open');
        });
    </script>
</body>
</html>
